<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="240" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="290" cy="210" r="90" fill="#ec4899" opacity="0.15" filter="url(#glow)"/>

  <!-- Search / AI Trinity Core Geometry -->
  <!-- Outer Search Ring -->
  <circle cx="240" cy="225" r="105" fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Search Handle -->
  <line x1="318" y1="303" x2="390" y2="375" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- AI Sparks / Neural Nodes in center of lens -->
  <!-- Central Sparkle -->
  <path d="M240 165 C240 200 245 225 280 225 C245 225 240 250 240 285 C240 250 235 225 200 225 C235 225 240 200 240 165 Z" fill="url(#cyanGrad)"/>
  
  <!-- Upper Right Sparkle -->
  <path d="M345 130 C345 148 348 160 366 160 C348 160 345 172 345 190 C345 172 342 160 324 160 C342 160 345 148 345 130 Z" fill="url(#goldGrad)"/>

  <!-- Bottom Mini Sparkle -->
  <circle cx="170" cy="180" r="7" fill="#38bdf8"/>
  <circle cx="310" cy="270" r="5" fill="#ec4899"/>

  <!-- Badges for SEO • AEO • GEO -->
  <g transform="translate(140, 422)">
    <rect width="232" height="38" rx="19" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="116" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">SEO • AEO • GEO</text>
  </g>
</svg>